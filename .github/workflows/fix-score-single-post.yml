name: Fix score single post route

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-score-single-post.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch score addon
        run: python3 .github/scripts/fix_score_single_post.py
      - name: Verify
        run: |
          test "$(grep -o 'function handleWorshipScorePost_' ScoreUpload_Addon.gs.txt | wc -l)" -eq 1
          test "$(grep -o 'function doPost(e)' ScoreUpload_Addon.gs.txt | wc -l)" -eq 0
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ScoreUpload_Addon.gs.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: make score addon use existing doPost router"
          git push
