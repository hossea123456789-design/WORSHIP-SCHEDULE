name: Worship frontend hotfix v3.9.3
on:
  push:
    branches: [main]
    paths: ['.github/workflows/promote-v38-simple.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch resilient bootstrap rendering
        run: |
          echo ' xMSkK' | tr -d ' ' | base64 -d >/dev/null
          python3 - <<'PY'
from pathlib import Path
p=Path('index.html')
s=p.read_text(encoding='utf-8')
s=s.replace("const APP_VERSION='v3.9.1';","const APP_VERSION='v3.9.3';",1)
marker='function loadQueue(){'
helper='''function normalizeState(raw){\n  const x=(raw&&typeof raw===\'object\')?raw:{};\n  const arr=name=>Array.isArray(x[name])?x[name].filter(v=>v&&typeof v===\'object\'):[];\n  x.config=(x.config&&typeof x.config===\'object\')?x.config:{};\n  x.roles=arr(\'roles\');x.members=arr(\'members\');x.memberRoles=arr(\'memberRoles\');x.events=arr(\'events\');x.assignments=arr(\'assignments\');x.prayerOrder=arr(\'prayerOrder\');x.rotationBase=arr(\'rotationBase\');x.holidays=arr(\'holidays\');\n  return x;\n}\nfunction validPrayerRows(){\n  const rows=Array.isArray(STATE&&STATE.prayerOrder)?STATE.prayerOrder:[];\n  return rows.filter(x=>x&&typeof x===\'object\'&&(String(x.member_id||\'\').trim()||String(x.display_name||\'\').trim()));\n}\n\n'''
if 'function normalizeState(raw)' not in s:s=s.replace(marker,helper+marker,1)
s=s.replace('if(x&&x.roles&&x.members){STATE=x;return true}','if(x&&x.roles&&x.members){STATE=normalizeState(x);return true}',1)
s=s.replace('    STATE=res.data;','    STATE=normalizeState(res.data);',1)
start=s.index('function prayerNameForSunday(d){')
end=s.index('\nfunction currentTodayKey(){',start)
newp='''function prayerNameForSunday(d){\n  const arr=validPrayerRows();\n  if(!arr.length)return\'미정\';\n  if(!(d instanceof Date)||Number.isNaN(d.getTime()))return\'미정\';\n  let anchor=String((STATE.config||{}).PRAYER_ANCHOR_DATE||\'2026-09-13\').trim();\n  if(!/^\\d{4}-\\d{2}-\\d{2}$/.test(anchor))anchor=\'2026-09-13\';\n  const anchorId=String((STATE.config||{}).PRAYER_ANCHOR_MEMBER_ID||\'m005\');\n  const ad=new Date(anchor+\'T00:00:00\');\n  if(Number.isNaN(ad.getTime()))return\'미정\';\n  const weeks=Math.round((d.getTime()-ad.getTime())/86400000/7);\n  let anchorIndex=arr.findIndex(x=>String(x.member_id||\'\')===anchorId);\n  if(anchorIndex<0)anchorIndex=0;\n  const idx=((anchorIndex+weeks)%arr.length+arr.length)%arr.length;\n  const row=arr[idx];\n  if(!row)return\'미정\';\n  return String(row.display_name||((getMember(row.member_id)||{}).member_name)||\'미정\');\n}\n'''
s=s[:start]+newp+s[end:]
start=s.index('function renderAll(){')
end=s.index('\nfunction renderHeader(){',start)
newr='''function renderAll(){\n  if(!STATE)return;\n  const sections=[[\'header\',renderHeader],[\'week\',renderWeek],[\'month\',renderMonth],[\'prayer\',renderPrayer],[\'playlist\',renderPlaylist],[\'settings\',renderSettings]];\n  sections.forEach(([name,fn])=>{try{fn()}catch(e){logEvent(\'ERROR\',\'RENDER_\'+name.toUpperCase()+\'_FAIL\',e&&e.message?e.message:String(e));}});\n}\n'''
s=s[:start]+newr+s[end:]
s=s.replace('const order=STATE.prayerOrder\n    .map(x=>x.display_name||((getMember(x.member_id)||{}).member_name)||\'\')','const order=validPrayerRows()\n    .map(x=>x.display_name||((getMember(x.member_id)||{}).member_name)||\'\')',1)
s=s.replace("document.getElementById('prayerOrderList').innerHTML=STATE.prayerOrder","document.getElementById('prayerOrderList').innerHTML=validPrayerRows()",1)
s=s.replace("window._prayerIds=STATE.prayerOrder.map(x=>String(x.member_id));","window._prayerIds=validPrayerRows().map(x=>String(x.member_id||'')).filter(Boolean);",1)
s=s.replace("const today=new Date((STATE.serverToday||keyOf(new Date()))+'T00:00:00');\n  viewMonth=new Date(today.getFullYear(),today.getMonth(),1);\n  pending.forEach(applyOptimistic);\n  renderAll();","const today=new Date(currentTodayKey()+'T00:00:00');\n  viewMonth=new Date(today.getFullYear(),today.getMonth(),1);\n  pending.forEach(applyOptimistic);\n  renderAll();",1)
p.write_text(s,encoding='utf-8')
assert "const APP_VERSION='v3.9.3';" in s
assert 'function normalizeState(raw)' in s
assert 'function validPrayerRows()' in s
assert 'STATE=normalizeState(res.data);' in s
PY
          python3 - <<'PY'
from pathlib import Path
import re
s=Path('index.html').read_text(encoding='utf-8')
Path('/tmp/v393.js').write_text('\n'.join(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)),encoding='utf-8')
PY
          node --check /tmp/v393.js
      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: isolate rendering and normalize state (v3.9.3)'
          git push
