name: Worship frontend hotfix v3.9.1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/promote-v38-simple.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch date rollover
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          Path('/tmp/v391.js').write_text('\n'.join(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)),encoding='utf-8')
          PY
          node --check /tmp/v391.js
      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: advance guidance after midnight (v3.9.1)'
          git push
