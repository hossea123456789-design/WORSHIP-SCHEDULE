name: Worship prayer date normalization hotfix

on:
  push:
    paths:
      - '.github/workflows/worship-hotfix-v392.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch prayer date normalization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('v3.9.2', 'v3.9.3')

          pattern = re.compile(r"function selectedDates\(mk\)\{.*?\n\}", re.S)
          replacement = r'''function selectedDates(mk){
            const map={};
            defaultSundays(mk).forEach(k=>map[k]=true);

            const events=Array.isArray(STATE&&STATE.events)?STATE.events:[];
            events.forEach(e=>{
              const raw=String((e&&e.event_date)||'');
              const match=raw.match(/^(\d{4}-\d{2}-\d{2})/);
              if(!match)return;
              const date=match[1];
              const parsed=new Date(date+'T00:00:00');
              if(Number.isNaN(parsed.getTime())||keyOf(parsed)!==date)return;
              if(date.slice(0,7)===mk)map[date]=isActive(e.active);
            });

            return Object.keys(map)
              .filter(k=>map[k]&&/^\d{4}-\d{2}-\d{2}$/.test(k))
              .sort();
          }'''
          s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'selectedDates patch count={count}')

          # defensive guard: never render invalid dates in prayer list
          old = "  const dates=upcomingWorshipDates(9);"
          new = "  const dates=upcomingWorshipDates(9).filter(date=>{const d=new Date(String(date)+'T00:00:00');return /^\\d{4}-\\d{2}-\\d{2}$/.test(String(date))&&!Number.isNaN(d.getTime())&&keyOf(d)===String(date)});"
          if old not in s:
              raise SystemExit('renderPrayer date guard target missing')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          if not scripts: raise SystemExit('script block missing')
          Path('/tmp/worship-app.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/worship-app.js
          grep -q 'v3.9.3' index.html
          grep -q 'const match=raw.match' index.html
          grep -q 'Number.isNaN(parsed.getTime())' index.html

      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix phantom prayer row from stale ISO dates'
          git push
