name: Worship hotfix v3.9.2

on:
  push:
    paths:
      - '.github/workflows/worship-hotfix-v392.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('v3.9.1','v3.9.2')
          prayer=re.compile(r"function prayerNameForSunday\(d\)\{.*?\n\}\n\n\nfunction currentTodayKey",re.S)
          s,c1=prayer.subn(r'''function prayerNameForSunday(d){
            const arr=Array.isArray(STATE&&STATE.prayerOrder)?STATE.prayerOrder.filter(x=>x&&typeof x==='object'):[];
            if(!arr.length)return'미정';
            const cfg=(STATE&&STATE.config)||{};
            const anchor=cfg.PRAYER_ANCHOR_DATE||'2026-09-13';
            const anchorId=cfg.PRAYER_ANCHOR_MEMBER_ID||'m_parkseongin';
            const ad=new Date(anchor+'T00:00:00');
            const target=d instanceof Date?d:new Date(d);
            const weeks=Math.round((target-ad)/86400000/7);
            if(!Number.isFinite(weeks))return'미정';
            let anchorIndex=arr.findIndex(x=>String(x.member_id||x.memberId||'')===String(anchorId));
            if(anchorIndex<0)anchorIndex=0;
            const index=((anchorIndex+weeks)%arr.length+arr.length)%arr.length;
            const row=arr[index];
            if(!row)return'미정';
            const memberId=row.member_id||row.memberId||'';
            return row.display_name||row.displayName||((getMember(memberId)||{}).member_name)||((getMember(memberId)||{}).name)||'미정';
          }


          function currentTodayKey''',s,count=1)
          render=re.compile(r"function renderAll\(\)\{.*?\n\}\n\nfunction renderHeader",re.S)
          s,c2=render.subn(r'''function renderAll(){
            if(!STATE)return;
            STATE.prayerOrder=Array.isArray(STATE.prayerOrder)?STATE.prayerOrder.filter(x=>x&&typeof x==='object'):[];
            STATE.roles=Array.isArray(STATE.roles)?STATE.roles.filter(Boolean):[];
            STATE.members=Array.isArray(STATE.members)?STATE.members.filter(Boolean):[];
            STATE.memberRoles=Array.isArray(STATE.memberRoles)?STATE.memberRoles.filter(Boolean):[];
            STATE.events=Array.isArray(STATE.events)?STATE.events.filter(Boolean):[];
            STATE.assignments=Array.isArray(STATE.assignments)?STATE.assignments.filter(Boolean):[];
            STATE.rotationBase=Array.isArray(STATE.rotationBase)?STATE.rotationBase.filter(Boolean):[];
            STATE.holidays=Array.isArray(STATE.holidays)?STATE.holidays.filter(Boolean):[];
            [['header',renderHeader],['week',renderWeek],['month',renderMonth],['prayer',renderPrayer],['playlist',renderPlaylist],['settings',renderSettings]].forEach(([name,fn])=>{
              try{fn()}catch(e){try{logEvent('ERROR','RENDER_SECTION_FAIL',`section=${name} msg=${e&&e.message?e.message:e}`)}catch(_){}}
            });
          }

          function renderHeader''',s,count=1)
          playlist=re.compile(r"function renderPlaylist\(\)\{.*?\n\}\n\nfunction formatBytes",re.S)
          s,c3=playlist.subn(r'''function renderPlaylist(){
            const cfg=(STATE&&STATE.config)||{};
            const playlistUrl=cfg.PLAYLIST_URL?cfg.PLAYLIST_URL:`https://youtube.com/playlist?list=${PLAYLIST_ID}`;
            const match=String(playlistUrl).match(/[?&]list=([^&]+)/);
            const playlistId=match?decodeURIComponent(match[1]):PLAYLIST_ID;
            const frame=document.getElementById('youtubeFrame');
            if(frame){
              const nextSrc=`https://www.youtube-nocookie.com/embed/videoseries?list=${encodeURIComponent(playlistId)}&playsinline=1&rel=0`;
              if(frame.dataset.playlistId!==playlistId){frame.dataset.playlistId=playlistId;frame.referrerPolicy='origin';frame.src=nextSrc;}
            }
            const link=document.getElementById('youtubeLink');
            if(link)link.href=playlistUrl;
          }

          function formatBytes''',s,count=1)
          if (c1,c2,c3)!=(1,1,1): raise SystemExit(f'patch counts: prayer={c1}, render={c2}, playlist={c3}')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix worship prayer render and YouTube load'
          git push
