name: Add WorshipApi recovery v3.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-worship-api-recovery.yml'

permissions:
  contents: write

jobs:
  build-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create recovery WorshipApi file
        shell: bash
        run: |
          cat > /tmp/worship-v35.b64 <<'B64'

B64
          base64 -d /tmp/worship-v35.b64 | gzip -d > WorshipApi_RECOVERY_v35.gs.txt
          cp WorshipApi_RECOVERY_v35.gs.txt /tmp/WorshipApi_RECOVERY_v35.js
      - name: Static preflight
        run: |
          node --check /tmp/WorshipApi_RECOVERY_v35.js
          test "$(grep -c '^function doGet' WorshipApi_RECOVERY_v35.gs.txt)" -eq 0
          test "$(grep -c '^function doPost' WorshipApi_RECOVERY_v35.gs.txt)" -eq 0
          grep -q "function handleWorshipApi_(e)" WorshipApi_RECOVERY_v35.gs.txt
          grep -q "DB_PROP: 'WORSHIP_DB_ID'" WorshipApi_RECOVERY_v35.gs.txt
          grep -q "action === 'bootstrap'" WorshipApi_RECOVERY_v35.gs.txt
          grep -q "action === 'revision'" WorshipApi_RECOVERY_v35.gs.txt
          grep -q "action === 'mutate'" WorshipApi_RECOVERY_v35.gs.txt
          for x in assignmentSet eventSet memberSave memberDelete roleSave roleDelete prayerOrderSet rotationComplete; do grep -q "$x" WorshipApi_RECOVERY_v35.gs.txt; done
          echo 'WORSHIP API RECOVERY PREFLIGHT OK'
      - name: Remove abandoned score experiment files
        run: |
          git rm -f --ignore-unmatch \
            ScoreUpload_Addon.gs.txt \
            .github/scripts/fix_score_addon_request_id.py \
            .github/scripts/fix_score_single_post.py \
            .github/scripts/worship_v33_score_patch.py \
            .github/scripts/worship_v35_recovery.py \
            .github/workflows/fix-score-addon-request-id.yml \
            .github/workflows/fix-score-single-post.yml \
            .github/workflows/worship-v35-recovery.yml
      - name: Commit clean recovery package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WorshipApi_RECOVERY_v35.gs.txt
          git rm -f --ignore-unmatch .github/workflows/add-worship-api-recovery.yml
          git commit -m "fix: add clean WorshipApi recovery and remove score experiment"
          git push
