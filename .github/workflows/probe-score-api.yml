name: Probe Worship Score API
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-score-api.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check score health
        run: |
          python3 - <<'PY'
          import json,re,urllib.parse,urllib.request
          base='https://script.google.com/macros/s/AKfycbxyjSCotbCTOQ54H3IqutFZM0xQRF-92_bvJWMNcJKWdgqQjGgThiGFBtRmK1LlXObOdQ/exec'
          q=urllib.parse.urlencode({'action':'health','callback':'probeCb'})
          with urllib.request.urlopen(base+'?'+q,timeout=30) as r: body=r.read().decode()
          m=re.fullmatch(r'\s*probeCb\((.*)\);?\s*',body,re.S)
          if not m: raise SystemExit(body[:500])
          data=json.loads(m.group(1))
          if data.get('ok') is not True or data.get('service')!='worship-score': raise SystemExit(repr(data))
          print('SCORE HEALTH OK', data.get('file'))
          PY
