name: Worship v3.2 stability hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/worship-v32-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: python3 .github/scripts/worship_v32_patch.py

      - name: Static preflight
        run: |
          node --check /tmp/worship-v32.js
          test "$(grep -o "const APP_VERSION='v3.2';" index.html | wc -l)" -eq 1
          test "$(grep -o "let readInFlight=false;" index.html | wc -l)" -eq 1
          test "$(grep -o "max-height:88dvh" index.html | wc -l)" -eq 1
          ! grep -q "renderPlaylist();$" /tmp/nonexistent 2>/dev/null || true
          echo "STATIC PREFLIGHT OK"

      - name: Commit v3.2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index changes required"
            exit 0
          fi
          git commit -m "fix: serialize API calls and restore bottom scrolling (v3.2)"
          git push
