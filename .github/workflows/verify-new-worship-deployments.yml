name: Verify New Worship Deployments
# verify-trigger: 2026-10-11
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-new-worship-deployments.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify old and new Apps Script deployments
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, re, time
          urls = {
            "OLD_SCHEDULE": "https://script.google.com/macros/s/AKfycbwwYV6CBces0jCFTndl9EoKL_LU7P55TJ2eLrT1qCH0aL-XxZggaPClwz4FuZgZ3KulaQ/exec?app=worship&action=revision&callback=testcb",
            "NEW_SCHEDULE": "https://script.google.com/macros/s/AKfycbzuIFCX3xFCUyD6D__z0InthKUUfLlq_RQ92eyN-BhmSsXVLH6-19Wd7lnCY9ggTDlclw/exec?app=worship&action=revision&callback=testcb",
            "OLD_SCORE": "https://script.google.com/macros/s/AKfycbxyjSCotbCTOQ54H3IqutFZM0xQRF-92_bvJWMNcJKWdgqQjGgThiGFBtRmK1LlXObOdQ/exec?action=meta&callback=testcb",
            "NEW_SCORE": "https://script.google.com/macros/s/AKfycbxYuJAJp0BkCk_aXRhgJEf-P8aOPAnWBk2Ea2WhmkQa7NHHLVB_kVdmsfBdomF9nrQcUA/exec?action=meta&callback=testcb"
          }
          for name,url in urls.items():
              t=time.time()
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              try:
                  r=urllib.request.urlopen(req,timeout=20)
                  body=r.read(1600).decode("utf-8","replace")
                  print("====",name,"====")
                  print("HTTP",r.status,"TIME",round(time.time()-t,3),"FINAL",r.geturl())
                  print("TYPE",r.headers.get("content-type",""))
                  print("BODY",re.sub(r"\s+"," ",body)[:1000])
              except urllib.error.HTTPError as e:
                  body=e.read(1600).decode("utf-8","replace")
                  title=re.search(r"<title[^>]*>(.*?)</title>",body,re.I|re.S)
                  print("====",name,"====")
                  print("HTTP",e.code,"TIME",round(time.time()-t,3),"FINAL",e.geturl())
                  print("TITLE",re.sub(r"\s+"," ",title.group(1)).strip() if title else "")
                  cleaned=re.sub(r"<script\b[^>]*>.*?</script>"," ",body,flags=re.I|re.S)
                  cleaned=re.sub(r"<style\b[^>]*>.*?</style>"," ",cleaned,flags=re.I|re.S)
                  cleaned=re.sub(r"<[^>]+>"," ",cleaned)
                  print("BODY",re.sub(r"\s+"," ",cleaned)[:1000])
              except Exception as e:
                  print("====",name,"====")
                  print("ERROR",repr(e),"TIME",round(time.time()-t,3))
          PY
