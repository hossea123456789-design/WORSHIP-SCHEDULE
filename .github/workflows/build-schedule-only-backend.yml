name: Build schedule-only worship backend

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-schedule-only-backend.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate schedule-only backend
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          src = Path('WorshipStandalone.gs.txt').read_text(encoding='utf-8')
          marker = '// WORSHIP-SCHEDULE Score Upload Add-on'
          if marker not in src:
              raise SystemExit('score marker missing')
          s = src.split(marker,1)[0].rstrip() + '\n'
          # Remove separate authorization helper entirely; setup will do all schedule-side authorization.
          s = re.sub(r'\nfunction authorizeWorshipStandalone\(\) \{.*?\n\}\n', '\n', s, flags=re.S)
          # Replace setup with one visible, complete setup routine. No Drive calls.
          pattern = r'function setupWorshipStandalone\(\) \{.*?\n\}'
          repl = '''function setupWorshipStandalone() {
            const ss = SpreadsheetApp.getActiveSpreadsheet();
            if (!ss) throw new Error('찬양팀_DB 스프레드시트에서 확장 프로그램 > Apps Script로 연 뒤 실행해주세요.');
            PropertiesService.getScriptProperties().setProperty(WORSHIP_API.DB_PROP, ss.getId());
            worshipValidateSchema_(ss);
            // Force the exact Sheets permission the deployed web app will use.
            const reopened = SpreadsheetApp.openById(ss.getId());
            reopened.getName();
            SpreadsheetApp.flush();
            return '일정 백엔드 연결/권한 확인 완료: ' + ss.getName();
          }'''
          s, n = re.subn(pattern, repl, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'setup replacement count={n}')
          # No score/Drive code must survive.
          forbidden = ['DriveApp', 'SCORE_STORE', 'handleWorshipScorePost_', 'function doPost(']
          for token in forbidden:
              if token in s:
                  raise SystemExit('forbidden token remains: ' + token)
          # Required entrypoints/features.
          required = ['function doGet(e)', 'function setupWorshipStandalone()', "action === 'bootstrap'", "action === 'revision'", "action === 'mutate'", "CONFIG: 'CONFIG'", "HOLIDAYS: ['holiday_date', 'holiday_name', 'holiday_type']"]
          for token in required:
              if token not in s:
                  raise SystemExit('required token missing: ' + token)
          Path('WorshipScheduleBackend.gs.txt').write_text(s, encoding='utf-8')
          Path('Code.gs.txt').write_text(s, encoding='utf-8')
          print('generated bytes', len(s.encode('utf-8')))
          PY
      - name: Static preflight
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('WorshipScheduleBackend.gs.txt').read_text(encoding='utf-8')
          assert s.count('function doGet(e)') == 1
          assert 'DriveApp' not in s
          assert 'function doPost(' not in s
          assert 'SCORE_STORE' not in s
          assert 'setupWorshipStandalone' in s
          print('schedule-only preflight OK')
          PY
      - name: Commit generated full files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add WorshipScheduleBackend.gs.txt Code.gs.txt
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'build: add schedule-only standalone Apps Script backend'
            git push
          fi
