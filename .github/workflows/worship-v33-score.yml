name: Worship v3.3 score upload

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/worship-v33-score.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply score frontend patch
        run: python3 .github/scripts/worship_v33_score_patch.py
      - name: Static preflight
        run: |
          node --check /tmp/worship-v33.js
          test "$(grep -o "const APP_VERSION='v3.3';" index.html | wc -l)" -eq 1
          test "$(grep -o 'id="scoreUploadBtn"' index.html | wc -l)" -eq 1
          test "$(grep -o 'function scorePost' index.html | wc -l)" -eq 1
          echo "STATIC PREFLIGHT OK"
      - name: Commit v3.3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index changes required"
            exit 0
          fi
          git commit -m "feat: add single-slot score upload and preview (v3.3)"
          git push
