name: Patch Standalone DB Setup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-standalone-setup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add one-click bound DB setup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('WorshipStandalone.gs.txt')
          s=p.read_text(encoding='utf-8')
          anchor='function setWorshipSpreadsheetId(id) {'
          if anchor not in s:
              raise SystemExit('setup anchor missing')
          if 'function setupWorshipStandalone()' not in s:
              helper='''function setupWorshipStandalone() {
            const ss = SpreadsheetApp.getActiveSpreadsheet();
            if (!ss) throw new Error('찬양팀_DB 스프레드시트에서 확장 프로그램 > Apps Script로 연 뒤 실행해주세요.');
            PropertiesService.getScriptProperties().setProperty(WORSHIP_API.DB_PROP, ss.getId());
            worshipValidateSchema_(ss);
            return '연결 완료: ' + ss.getName() + ' / ' + ss.getId();
          }

          '''
              s=s.replace(anchor,helper+anchor,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Static preflight
        run: |
          cp WorshipStandalone.gs.txt /tmp/WorshipStandalone.js
          node --check /tmp/WorshipStandalone.js
          grep -q 'function setupWorshipStandalone()' WorshipStandalone.gs.txt
          grep -q 'SpreadsheetApp.getActiveSpreadsheet()' WorshipStandalone.gs.txt
          grep -q 'worshipValidateSchema_(ss)' WorshipStandalone.gs.txt
          grep -q "WORSHIP_SPREADSHEET_ID" WorshipStandalone.gs.txt
          test "$(grep -c '^function doGet' WorshipStandalone.gs.txt)" -eq 1
          test "$(grep -c '^function doPost' WorshipStandalone.gs.txt)" -eq 1
          echo 'SETUP PREFLIGHT OK'
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WorshipStandalone.gs.txt
          git commit -m "fix: add one-click setup for existing worship DB"
          git push
