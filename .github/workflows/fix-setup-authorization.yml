name: Fix setup authorization
on:
  push:
    paths:
      - '.github/scripts/fix_setup_authorization.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch setup authorization
        run: python .github/scripts/fix_setup_authorization.py
      - name: Static preflight
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('WorshipStandalone.gs.txt').read_text(encoding='utf-8')
          assert 'function setupWorshipStandalone()' in s
          assert 'SpreadsheetApp.openById(id)' in s
          assert 'DriveApp.getRootFolder().getName()' in s
          assert 'function authorizeWorshipStandalone()' not in s
          assert s.count('function doGet(')==1
          assert s.count('function doPost(')==1
          print('preflight ok')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WorshipStandalone.gs.txt
          git diff --cached --quiet || git commit -m "fix: authorize worship scopes in setup function"
          git push
