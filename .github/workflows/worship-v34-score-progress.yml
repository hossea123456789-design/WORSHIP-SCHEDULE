name: Worship v3.4 score upload progress

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/worship-v34-score-progress.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v3.4 patch
        run: python3 .github/scripts/worship_v34_score_progress.py
      - name: Static preflight
        run: |
          node --check /tmp/worship-v34.js
          test "$(grep -o "const APP_VERSION='v3.4';" index.html | wc -l)" -eq 1
          test "$(grep -o 'id="scoreProgress"' index.html | wc -l)" -eq 1
          test "$(grep -o "uploadStart" index.html | wc -l)" -ge 1
          test "$(grep -o "uploadChunk" ScoreUpload_Addon.gs.txt | wc -l)" -ge 1
          test "$(grep -o "uploadType=resumable" ScoreUpload_Addon.gs.txt | wc -l)" -eq 1
          echo "STATIC PREFLIGHT OK"
      - name: Commit v3.4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ScoreUpload_Addon.gs.txt
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: chunk score uploads with progress and ETA (v3.4)"
          git push
