name: Fix Worship DB property v3.7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-worship-db-property-v37.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch DB property
        run: python3 .github/scripts/fix_worship_db_property_v37.py
      - name: Static preflight
        run: |
          cp WorshipApi.gs.txt /tmp/WorshipApi.js
          node --check /tmp/WorshipApi.js
          grep -q "DB_PROP: 'SPREADSHEET_ID'" WorshipApi.gs.txt
          grep -q "SpreadsheetApp.getActiveSpreadsheet()" WorshipApi.gs.txt
          grep -q "getProperty('WORSHIP_DB_ID')" WorshipApi.gs.txt
          test "$(grep -c '^function doGet' WorshipApi.gs.txt || true)" -eq 0
          test "$(grep -c '^function doPost' WorshipApi.gs.txt || true)" -eq 0
          echo 'WORSHIP DB PREFLIGHT OK'
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WorshipApi.gs.txt WorshipApi_RECOVERY_v35.gs.txt
          git commit -m "fix: use existing SPREADSHEET_ID for worship DB (v3.7)"
          git push
