name: One-time Worship v3.11 score viewer UX

on:
  push:
    paths:
      - '.github/workflows/one-time-v311-score-viewer.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate patch script
        run: python3 -m py_compile .github/scripts/patch_score_viewer_v311.py
      - name: Patch score viewer UX
        run: python3 .github/scripts/patch_score_viewer_v311.py
      - name: Preflight JavaScript syntax
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('index.html','utf8');const a=s.indexOf('<script>'),b=s.lastIndexOf('</script>');if(a<0||b<a)process.exit(2);fs.writeFileSync('/tmp/worship-app.js',s.slice(a+8,b));"
          node --check /tmp/worship-app.js
          grep -q "const APP_VERSION='v3.11.0'" index.html
          grep -q "scoreImagePreview" index.html
          grep -q "미리보기 접기" index.html
      - name: Commit frontend
        run: |
          git config user.name "openai-worship-maintainer"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: improve score viewer usability (v3.11.0)"
          git push
