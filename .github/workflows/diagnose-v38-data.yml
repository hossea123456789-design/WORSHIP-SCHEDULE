name: Diagnose Worship v3.8 Data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-v38-data.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect schedule bootstrap and score POST
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, urllib.parse, urllib.request

          schedule='https://script.google.com/macros/s/AKfycbwwYV6CBces0jCFTndl9EoKL_LU7P55TJ2eLrT1qCH0aL-XxZggaPClwz4FuZgZ3KulaQ/exec'
          score='https://script.google.com/macros/s/AKfycbxyjSCotbCTOQ54H3IqutFZM0xQRF-92_bvJWMNcJKWdgqQjGgThiGFBtRmK1LlXObOdQ/exec'

          q=urllib.parse.urlencode({'app':'worship','action':'bootstrap','callback':'cb','_':'diag'})
          req=urllib.request.Request(schedule+'?'+q,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=30) as r:
              body=r.read().decode('utf-8')
          m=re.fullmatch(r'\s*cb\((.*)\);?\s*',body,re.S)
          if not m: raise SystemExit('bootstrap invalid: '+body[:300])
          data=json.loads(m.group(1))
          if data.get('ok') is not True: raise SystemExit('bootstrap failed: '+str(data))
          d=data['data']
          print('revision=',d.get('revision'))
          print('events=',len(d.get('events',[])))
          print('assignments=',len(d.get('assignments',[])))
          print('rotationBase=',len(d.get('rotationBase',[])))
          print('rotationBaseRows=',json.dumps(d.get('rotationBase',[]),ensure_ascii=False))
          print('activeAssignments=',json.dumps(d.get('assignments',[]),ensure_ascii=False))

          payload=urllib.parse.urlencode({'app':'worship-score','action':'meta','requestId':'diag_meta'}).encode()
          req=urllib.request.Request(score,data=payload,headers={'User-Agent':'Mozilla/5.0','Content-Type':'application/x-www-form-urlencoded'},method='POST')
          with urllib.request.urlopen(req,timeout=30) as r:
              html=r.read().decode('utf-8')
          print('scorePostStatus=',r.status)
          print('scorePostBody=',html[:1000])
          if 'worship-score-api' not in html or 'diag_meta' not in html:
              raise SystemExit('score POST meta response invalid')
          PY
