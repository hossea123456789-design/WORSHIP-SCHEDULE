name: One-time Worship v3.10 frontend patch

on:
  push:
    paths:
      - '.github/workflows/one-time-v310-frontend.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch frontend
        run: python3 patch_v310.py
      - name: Preflight JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/app.js').write_text('\n'.join(blocks),encoding='utf-8')
          assert "APP_VERSION='v3.10.0'" in s
          assert 'horizonEndKey' in s
          assert 'startSyncProgress' in s
          assert 'normalizeDateKey' in s
          PY
          node --check /tmp/app.js
      - name: Commit frontend
        shell: bash
        run: |
          git config user.name "openai-worship-maintainer"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "feat: rolling 12-month schedule and sync progress (v3.10.0)"
          git push
