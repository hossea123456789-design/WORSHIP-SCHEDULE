name: Worship v3.5 recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/worship-v35-recovery.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore last known working frontend
        run: git show 8f2d63d2719906d75ee0e734c703a148c24c2f23:index.html > index.html
      - name: Apply narrow recovery fixes
        run: python3 .github/scripts/worship_v35_recovery.py
      - name: Static preflight
        run: |
          node --check /tmp/worship-v35.js
          test "$(grep -o "const APP_VERSION='v3.5';" index.html | wc -l)" -eq 1
          test "$(grep -o "const STORAGE_PREFIX='worship_fast_v3_';" index.html | wc -l)" -eq 1
          test "$(grep -o 'let readInFlight=false;' index.html | wc -l)" -eq 1
          test "$(grep -o 'let needsFullRefresh=false;' index.html | wc -l)" -eq 1
          test "$(grep -o 'scoreUploadBtn' index.html | wc -l)" -eq 0
          test "$(grep -o 'bottom:calc(72px + env(safe-area-inset-bottom))' index.html | wc -l)" -eq 1
          test "$(grep -o 'bottom:calc(116px + env(safe-area-inset-bottom))' index.html | wc -l)" -eq 1
          test "$(grep -o 'retryTimer=setTimeout(flushQueue,30000)' index.html | wc -l)" -eq 1
          echo 'STATIC PREFLIGHT OK'
      - name: Commit recovery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m "fix: restore stable worship core and separate status UI (v3.5)"
          git push
