name: Worship v3.6 connection recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/worship-v36-connection-recovery.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply connection recovery patch
        run: python3 .github/scripts/worship_v36_connection_recovery.py
      - name: Static preflight
        run: |
          node --check /tmp/worship-v36.js
          test "$(grep -o "const APP_VERSION='v3.6';" index.html | wc -l)" -eq 1
          test "$(grep -o 'let hardConnectionDown=false;' index.html | wc -l)" -eq 1
          test "$(grep -o 'retryTimer=setTimeout(flushQueue,30000)' index.html | wc -l)" -eq 0
          grep -q 'API_RECOVERED' index.html
          grep -q 'API_SCRIPT_ERROR' index.html
          grep -q "저장 보류 · 서버 확인 중" index.html
          grep -q "bottom:calc(72px + env(safe-area-inset-bottom))" index.html
          grep -q "bottom:calc(116px + env(safe-area-inset-bottom))" index.html
          echo 'STATIC PREFLIGHT OK'
      - name: Commit v3.6
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: stop hard-failure retry loop and recover via revision probe (v3.6)"
          git push

# rerun-marker: 2
