name: Build Worship v3.7 Ready Frontend

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v37-ready.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge score UI into current v3.6
        run: |
          git show 9596e3e3b5f10bb229db4083f9f007a521478363:index.html > /tmp/v34.html
          python3 - <<'PY'
          from pathlib import Path
          import re

          current=Path('index.html').read_text(encoding='utf-8')
          old=Path('/tmp/v34.html').read_text(encoding='utf-8')
          s=current

          s=s.replace("const APP_VERSION='v3.6';","const APP_VERSION='v3.7-ready';",1)

          # CSS: score block from v3.4
          m=re.search(r'(\.scoreCard\{[\s\S]*?@media\(max-width:520px\)\{\.scorePreview\{height:58vh;min-height:360px\}\})',old)
          if not m: raise SystemExit('score css not found')
          score_css=m.group(1)
          if '.scoreCard{' not in s:
              pos=s.find('.bottomNav{')
              if pos<0: raise SystemExit('bottomNav css anchor missing')
              s=s[:pos]+score_css+'\n'+s[pos:]

          # HTML: score card inside playlist panel
          m=re.search(r'(<div class="card scoreCard">[\s\S]*?<div class="scoreProgressDetail" id="scoreProgressDetail"></div></div></div></div>)</section>',old)
          if not m: raise SystemExit('score html not found')
          score_html=m.group(1)
          if 'id="scoreUploadBtn"' not in s:
              p=s.find('<section id="tab-playlist"')
              if p<0: raise SystemExit('playlist section missing')
              q=s.find('</section>',p)
              if q<0: raise SystemExit('playlist section end missing')
              s=s[:q]+'\n'+score_html+s[q:]

          # State
          if 'let SCORE_META=null;' not in s:
              anchor='let startupSyncTimer=null;'
              if anchor not in s: raise SystemExit('startup state anchor missing')
              s=s.replace(anchor,anchor+'\nlet SCORE_META=null;\nlet scoreBusy=false;\nlet scoreProgressHideTimer=null;',1)

          # Functions: extract v3.4 score helpers through before renderSettings
          a=old.find('function formatBytes(')
          b=old.find('function renderSettings()',a)
          if a<0 or b<0: raise SystemExit('score function block missing')
          score_funcs=old[a:b]
          if 'function uploadScoreFile(file)' not in s:
              target=s.find('function renderSettings()')
              if target<0: raise SystemExit('renderSettings anchor missing')
              s=s[:target]+score_funcs+'\n'+s[target:]

          # Handlers
          if "document.getElementById('scoreUploadBtn').onclick" not in s:
              anchor="document.getElementById('retryConnection').onclick=()=>bootstrap(false);"
              if anchor not in s: raise SystemExit('retry handler missing')
              extra="\ndocument.getElementById('scoreUploadBtn').onclick=()=>document.getElementById('scoreFileInput').click();\ndocument.getElementById('scoreFileInput').onchange=e=>uploadScoreFile(e.target.files&&e.target.files[0]);"
              s=s.replace(anchor,anchor+extra,1)

          # Lazy score metadata when playlist tab opens
          if "b.dataset.tab==='playlist'" not in s:
              anchor="  document.getElementById('tab-'+b.dataset.tab).classList.add('active');\n  window.scrollTo({top:0,behavior:'smooth'});"
              if anchor not in s: raise SystemExit('tab switch anchor missing')
              repl="  document.getElementById('tab-'+b.dataset.tab).classList.add('active');\n  if(b.dataset.tab==='playlist'&&!SCORE_META&&!scoreBusy)loadScoreMeta(true);\n  window.scrollTo({top:0,behavior:'smooth'});"
              s=s.replace(anchor,repl,1)

          # Startup score metadata
          if 'setTimeout(()=>loadScoreMeta(true),1400);' not in s:
              anchor='renderPlaylist();\n\npollTimer=setInterval(pollRevision,30000);'
              if anchor not in s: raise SystemExit('startup render anchor missing')
              s=s.replace(anchor,'renderPlaylist();\nrenderScore();\nsetTimeout(()=>loadScoreMeta(true),1400);\n\npollTimer=setInterval(pollRevision,30000);',1)

          Path('index_v37_ready.html').write_text(s,encoding='utf-8')
          PY
      - name: Static preflight
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index_v37_ready.html').read_text(encoding='utf-8')
          a=s.rfind('<script>')+len('<script>')
          b=s.rfind('</script>')
          Path('/tmp/v37.js').write_text(s[a:b],encoding='utf-8')
          PY
          node --check /tmp/v37.js
          grep -q "const APP_VERSION='v3.7-ready'" index_v37_ready.html
          grep -q 'id="scoreUploadBtn"' index_v37_ready.html
          grep -q 'id="scoreProgress"' index_v37_ready.html
          grep -q "function uploadScoreFile(file)" index_v37_ready.html
          grep -q "uploadStart" index_v37_ready.html
          grep -q "uploadChunk" index_v37_ready.html
          grep -q "API_SCRIPT_ERROR" index_v37_ready.html
          grep -q "API_RECOVERED" index_v37_ready.html
          grep -q "bottom:calc(72px + env(safe-area-inset-bottom))" index_v37_ready.html
          echo 'V3.7 READY PREFLIGHT OK'
      - name: Commit prepared frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index_v37_ready.html
          git commit -m "feat: prepare v3.7 frontend with score upload on v3.6 core"
          git push
