name: Add standalone authorization helper

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-standalone-auth-helper.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add visible authorization helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('WorshipStandalone.gs.txt')
          s=p.read_text(encoding='utf-8')
          anchor='function setupWorshipStandalone() {'
          if 'function authorizeWorshipStandalone() {' in s:
              raise SystemExit('authorizeWorshipStandalone already exists')
          helper='''function authorizeWorshipStandalone() {\n  const id = PropertiesService.getScriptProperties().getProperty(WORSHIP_API.DB_PROP);\n  if (!id) throw new Error('먼저 setupWorshipStandalone()을 실행해주세요.');\n  const ss = SpreadsheetApp.openById(id);\n  const name = ss.getName();\n  DriveApp.getRootFolder().getName();\n  return '권한 승인 완료: ' + name;\n}\n\n'''
          if anchor not in s:
              raise SystemExit('setup anchor missing')
          s=s.replace(anchor, helper+anchor, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Static preflight
        run: |
          grep -F 'function authorizeWorshipStandalone()' WorshipStandalone.gs.txt
          grep -F 'SpreadsheetApp.openById(id)' WorshipStandalone.gs.txt
          grep -F 'DriveApp.getRootFolder()' WorshipStandalone.gs.txt
          echo 'AUTH HELPER PREFLIGHT OK'
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add WorshipStandalone.gs.txt
          git commit -m 'fix: add visible standalone authorization helper'
          git push
