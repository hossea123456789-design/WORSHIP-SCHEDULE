name: Fix standalone holidays schema

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-standalone-holidays-schema.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch HOLIDAYS to existing DB
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('WorshipStandalone.gs.txt')
          s=p.read_text(encoding='utf-8')
          old="HOLIDAYS: ['holiday_date', 'holiday_name', 'holiday_type', 'source']"
          new="HOLIDAYS: ['holiday_date', 'holiday_name', 'holiday_type']"
          c=s.count(old)
          if c!=1: raise SystemExit(f'holidays anchor mismatch: {c}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Final schema preflight
        run: |
          cp WorshipStandalone.gs.txt /tmp/WorshipStandalone.js
          node --check /tmp/WorshipStandalone.js
          grep -q "CONFIG: \['key', 'value', 'description'\]" WorshipStandalone.gs.txt
          grep -q "ROLES: \['role_id', 'role_name', 'display_order', 'color_key', 'allow_multiple', 'active'\]" WorshipStandalone.gs.txt
          grep -q "MEMBERS: \['member_id', 'member_name', 'display_order', 'active'\]" WorshipStandalone.gs.txt
          grep -q "MEMBER_ROLES: \['member_id', 'role_id', 'active'\]" WorshipStandalone.gs.txt
          grep -q "EVENTS: \['event_date', 'event_type', 'title', 'active', 'source', 'updated_at'\]" WorshipStandalone.gs.txt
          grep -q "ASSIGNMENTS: \['assignment_id', 'event_date', 'role_id', 'member_id', 'sort_order', 'source', 'active', 'updated_at'\]" WorshipStandalone.gs.txt
          grep -q "PRAYER_ORDER: \['position', 'member_id', 'display_name', 'active'\]" WorshipStandalone.gs.txt
          grep -q "ROTATION_BASE: \['base_month', 'event_index', 'role_id', 'member_id', 'sort_order', 'active', 'updated_at'\]" WorshipStandalone.gs.txt
          grep -q "HOLIDAYS: \['holiday_date', 'holiday_name', 'holiday_type'\]" WorshipStandalone.gs.txt
          grep -q "MUTATION_LOG: \['mutation_id', 'client_id', 'mutation_type', 'applied_at'\]" WorshipStandalone.gs.txt
          ! grep -q "APP_CONFIG" WorshipStandalone.gs.txt
          echo 'FINAL EXISTING-DB SCHEMA PREFLIGHT OK'
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WorshipStandalone.gs.txt
          git commit -m "fix: match holidays schema to existing worship DB"
          git push
