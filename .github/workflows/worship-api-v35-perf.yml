name: WorshipApi v3.5 perf patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/worship-api-v35-perf.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch WorshipApi recovery
        run: python3 .github/scripts/worship_api_v35_perf_patch.py
      - name: Static preflight
        run: |
          cp WorshipApi_RECOVERY_v35.gs.txt /tmp/WorshipApi_RECOVERY_v35.js
          node --check /tmp/WorshipApi_RECOVERY_v35.js
          test "$(grep -c '^function doGet' WorshipApi_RECOVERY_v35.gs.txt || true)" -eq 0
          test "$(grep -c '^function doPost' WorshipApi_RECOVERY_v35.gs.txt || true)" -eq 0
          test "$(grep -c 'worshipValidateSchema_(ss);' WorshipApi_RECOVERY_v35.gs.txt)" -eq 1
          grep -q 'worshipMonthNum_(x) <= target' WorshipApi_RECOVERY_v35.gs.txt
          grep -q "case 'rotationComplete'" WorshipApi_RECOVERY_v35.gs.txt
          grep -q "case 'memberSave'" WorshipApi_RECOVERY_v35.gs.txt
          echo 'WORSHIP API PREFLIGHT OK'
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WorshipApi_RECOVERY_v35.gs.txt
          git commit -m "fix: speed WorshipApi mutations and preserve current rotation base"
          git push
