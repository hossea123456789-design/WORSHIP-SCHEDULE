name: Probe Live Apps Script APIs
# probe-trigger: 2026-10-12T00:03+09:00 honorific-live-check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-live-apis.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe current schedule bootstrap
        shell: bash
        run: |
          set -u
          URL='https://script.google.com/macros/s/AKfycbzuIFCX3xFCUyD6D__z0InthKUUfLlq_RQ92eyN-BhmSsXVLH6-19Wd7lnCY9ggTDlclw/exec?app=worship&action=bootstrap&callback=testcb&_='$(date +%s)
          echo "===== CURRENT SCHEDULE BOOTSTRAP ====="
          curl -sS -L -o /tmp/body -D /tmp/headers --max-time 40 -w '\nHTTP=%{http_code}\nTIME=%{time_total}\n' "$URL" || true
          cat /tmp/headers
          echo "--- body ---"
          head -c 12000 /tmp/body || true
          echo
