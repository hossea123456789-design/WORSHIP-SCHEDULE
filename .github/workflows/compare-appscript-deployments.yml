name: Compare Apps Script Deployments
# compare-trigger: 2026-10-11T01:07+09
on:
  push:
    branches: [main]
    paths: ['.github/workflows/compare-appscript-deployments.yml']
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Compare public Apps Script endpoints
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, re, time
          urls = {
            "WORSHIP_SCHEDULE": "https://script.google.com/macros/s/AKfycbwwYV6CBces0jCFTndl9EoKL_LU7P55TJ2eLrT1qCH0aL-XxZggaPClwz4FuZgZ3KulaQ/exec?app=worship&action=revision&callback=testcb",
            "WORSHIP_SCORE": "https://script.google.com/macros/s/AKfycbxyjSCotbCTOQ54H3IqutFZM0xQRF-92_bvJWMNcJKWdgqQjGgThiGFBtRmK1LlXObOdQ/exec?action=meta&callback=testcb",
            "MAPLE_LEDGER": "https://script.google.com/macros/s/AKfycby9srJlhi9sWjpMxJSpyhWgkNRP6RwOyVDRyPRsUDDSceflQgnFP9A7yXaGIXGuj9Ad0Q/exec",
            "LEAVE_CALENDAR": "https://script.google.com/macros/s/AKfycbyY2fIuUMt5al5Mh5ZeooAdYXD29gKvzEWRmoze8mZENnoSh8_DgANmcV1SwkUQ-IMfYQ/exec",
            "SHARE_REWARD": "https://script.google.com/macros/s/AKfycbwn3g81buXd0YFZsq3qdXFJxk6KCKfMlR1WXEdMffAUsoq3glf9PVr5zebCJvkrL7H2/exec"
          }
          for name,url in urls.items():
              t=time.time()
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              try:
                  r=urllib.request.urlopen(req,timeout=20)
                  body=r.read(1800).decode("utf-8","replace")
                  print("====",name,"====")
                  print("HTTP",r.status,"TIME",round(time.time()-t,3),"FINAL",r.geturl())
                  print("TYPE",r.headers.get("content-type",""))
                  print("BODY",re.sub(r"\s+"," ",body)[:700])
              except urllib.error.HTTPError as e:
                  body=e.read(1800).decode("utf-8","replace")
                  title=re.search(r"<title[^>]*>(.*?)</title>",body,re.I|re.S)
                  print("====",name,"====")
                  print("HTTP",e.code,"TIME",round(time.time()-t,3),"FINAL",e.geturl())
                  print("TITLE",re.sub(r"\s+"," ",title.group(1)).strip() if title else "")
                  cleaned=re.sub(r"<script\b[^>]*>.*?</script>"," ",body,flags=re.I|re.S)
                  cleaned=re.sub(r"<style\b[^>]*>.*?</style>"," ",cleaned,flags=re.I|re.S)
                  cleaned=re.sub(r"<[^>]+>"," ",cleaned)
                  print("BODY",re.sub(r"\s+"," ",cleaned)[:700])
              except Exception as e:
                  print("====",name,"====")
                  print("ERROR",repr(e),"TIME",round(time.time()-t,3))
          PY
