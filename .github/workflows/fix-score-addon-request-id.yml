name: Fix score addon request id

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-score-addon-request-id.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch addon
        run: python3 .github/scripts/fix_score_addon_request_id.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ScoreUpload_Addon.gs.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: correlate score iframe responses"
          git push
