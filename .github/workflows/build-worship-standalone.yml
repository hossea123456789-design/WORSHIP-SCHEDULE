name: Build Worship Standalone Backend

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-worship-standalone.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build standalone backend
        run: |
          git show 303ee91f9bc39cdfe8b16a1c46b0fc0b96d8b907:ScoreUpload_Addon.gs.txt > /tmp/score.gs
          python3 - <<'PY'
          from pathlib import Path
          import re

          schedule=Path('WorshipApi.gs.txt').read_text(encoding='utf-8')
          score=Path('/tmp/score.gs').read_text(encoding='utf-8')

          schedule=re.sub(r'/\*\*[\s\S]*?\*/', '''/**
           * WORSHIP-SCHEDULE standalone Apps Script backend
           * - Maple DB와 완전히 분리된 찬양팀 전용 프로젝트용
           * - GET: bootstrap / revision / mutate(JSONP)
           * - POST: 악보 meta / uploadStart / uploadChunk / delete
           * - 기존 찬양팀 스프레드시트를 WORSHIP_SPREADSHEET_ID로 연결
           */''', schedule, count=1)
          schedule=schedule.replace("DB_PROP: 'SPREADSHEET_ID'", "DB_PROP: 'WORSHIP_SPREADSHEET_ID'", 1)

          anchor='function handleWorshipApi_(e) { return worshipHandleRequest_(e); }'
          if anchor not in schedule:
              raise SystemExit('schedule handler anchor missing')
          schedule=schedule.replace(anchor, "function doGet(e) { return worshipHandleRequest_(e); }\n\n"+anchor, 1)

          old_db=re.search(r'function worshipDb_\(\) \{[\s\S]*?\n\}', schedule)
          if not old_db:
              raise SystemExit('worshipDb_ not found')
          new_db='''function setWorshipSpreadsheetId(id) {
            const value = String(id || '').trim();
            if (!value) throw new Error('스프레드시트 ID가 비어 있습니다.');
            const ss = SpreadsheetApp.openById(value);
            PropertiesService.getScriptProperties().setProperty(WORSHIP_API.DB_PROP, ss.getId());
            return ss.getName();
          }

          function worshipDb_() {
            const id = PropertiesService.getScriptProperties().getProperty(WORSHIP_API.DB_PROP);
            if (!id) throw new Error('WORSHIP_SPREADSHEET_ID가 없습니다. setWorshipSpreadsheetId("스프레드시트ID")를 한 번 실행해주세요.');
            return SpreadsheetApp.openById(id);
          }'''
          schedule=schedule[:old_db.start()]+new_db+schedule[old_db.end():]

          if 'function handleWorshipScorePost_(e)' not in score:
              raise SystemExit('score handler missing')
          score=score.replace('function handleWorshipScorePost_(e) {', 'function doPost(e) { return handleWorshipScorePost_(e); }\n\nfunction handleWorshipScorePost_(e) {', 1)
          score=score.replace('// Apps Script 프로젝트의 새 .gs 파일에 그대로 붙여넣으세요.','// Standalone backend에 포함된 악보 업로드 모듈입니다.')
          score=score.replace('// 주의: 이 파일은 doPost를 정의하지 않습니다. 기존 Code.gs의 단일 doPost에서 handleWorshipScorePost_(e)로 라우팅해야 합니다.','// 이 독립 프로젝트에서는 doPost가 직접 악보 요청을 처리합니다.')

          out=schedule.rstrip()+'\n\n'+score.rstrip()+'\n'
          Path('WorshipStandalone.gs.txt').write_text(out,encoding='utf-8')
          PY
      - name: Static preflight
        run: |
          cp WorshipStandalone.gs.txt /tmp/WorshipStandalone.js
          node --check /tmp/WorshipStandalone.js
          test "$(grep -c '^function doGet' WorshipStandalone.gs.txt)" -eq 1
          test "$(grep -c '^function doPost' WorshipStandalone.gs.txt)" -eq 1
          grep -q "WORSHIP_SPREADSHEET_ID" WorshipStandalone.gs.txt
          grep -q "function setWorshipSpreadsheetId" WorshipStandalone.gs.txt
          grep -q "action === 'bootstrap'" WorshipStandalone.gs.txt
          grep -q "action === 'revision'" WorshipStandalone.gs.txt
          grep -q "action === 'mutate'" WorshipStandalone.gs.txt
          grep -q "action === 'uploadStart'" WorshipStandalone.gs.txt
          grep -q "action === 'uploadChunk'" WorshipStandalone.gs.txt
          grep -q "WORSHIP_SCORE_FILE_ID" WorshipStandalone.gs.txt
          grep -q "setSharing(DriveApp.Access.ANYONE_WITH_LINK" WorshipStandalone.gs.txt
          ! grep -q "Maple" WorshipStandalone.gs.txt
          echo 'STANDALONE PREFLIGHT OK'
      - name: Commit standalone backend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WorshipStandalone.gs.txt
          git commit -m "feat: build standalone worship backend with score upload"
          git push
