name: Worship v3.1 one-shot hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index.html
        run: python3 .github/hotfix_v31.py

      - name: Static preflight
        shell: bash
        run: |
          node --check /tmp/worship-app.js
          test "$(grep -o "const APP_VERSION='v3.1';" index.html | wc -l)" -eq 1
          test "$(grep -o "function bootstrap(showLoading=true,silentFailure=false)" index.html | wc -l)" -eq 1
          test "$(grep -o "MUTATE_TIMEOUT_MS=25000" index.html | wc -l)" -eq 1
          echo "STATIC PREFLIGHT OK"

      - name: Commit hotfix
        shell: bash
        run: |
          rm -f .github/workflows/worship-v31-hotfix.yml .github/hotfix_v31.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/worship-v31-hotfix.yml .github/hotfix_v31.py
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "fix: stabilize save sync and background refresh (v3.1)"
          git push
