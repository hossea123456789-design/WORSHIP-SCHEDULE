<body>
<div class="app">

<div class="card weekCard"><div class="weekHead"><div class="weekTitle">다음 주<span class="weekBadge">NEXT WEEK</span></div><div class="dateLine">일정을 불러오는 중</div></div><div class="weekRoles"><div class="weekRole"><div class="roleLabel"><span class="roleDot"></span><span class="skeleton" style="width:58px;height:15px;border-radius:7px"></span></div><div class="people"><span class="person skeleton" style="width:72px"></span></div></div><div class="weekRole"><div class="roleLabel"><span class="roleDot"></span><span class="skeleton" style="width:72px;height:15px;border-radius:7px"></span></div><div class="people"><span class="person skeleton" style="width:84px"></span></div></div></div></div>
</div></section>

<section id="tab-prayer" class="panel"><div class="sectionTitle"><h2>기도 순서</h2></div><div id="prayerHero"></div><div class="card settingCard"><div class="cardHead"><h3>기도 안내 문구</h3><button class="primaryBtn" id="copyPrayer">복사</button></div><div class="cardBody"><div class="info" id="prayerCopyText" style="white-space:pre-line;user-select:text"></div></div></div><div class="card settingCard"><div class="cardHead"><h3>앞으로 9주</h3></div><div class="cardBody" id="prayerUpcoming"></div></div></section>

<div class="card settingCard"><div class="cardHead"><h3>진단 로그</h3><button class="primaryBtn" id="copyLog">로그 복사</button></div><div class="cardBody"><div class="logMeta" id="logMeta">최근 동작 기록을 저장합니다.</div><div class="logActions"><button class="ghostBtn" id="clearLog">로그 비우기</button></div></div></div>
</section>
</main>
<nav class="bottomNav"><button class="navBtn active" data-tab="week"><span>🏠</span>이번주</button><button class="navBtn" data-tab="month"><span>📅</span>월별</button><button class="navBtn" data-tab="prayer"><span>🙏</span>기도</button><button class="navBtn" data-tab="playlist"><span>▶️</span>찬양</button><button class="navBtn" data-tab="settings"><span>⚙️</span>설정</button></nav>
</div>

function monthKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function sundayOfWeek(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-x.getDay());return x}
function isActive(v){return v===true||String(v).toLowerCase()==='true'||String(v)==='1'}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}
function roleClass(role){const k=String((role&&role.color_key)||'other');return ['leader','piano','bass','drum','singer'].includes(k)?k:'other'}

const LOG_LIMIT=200;
let processStatus='연결 중…';
function readLogs(){try{const x=JSON.parse(safeGet('diagnostic_log')||'[]');return Array.isArray(x)?x:[]}catch(e){return[]}}
function writeLogs(a){safeSet('diagnostic_log',JSON.stringify(a.slice(-LOG_LIMIT)))}
function logEvent(level,event,detail){
  const a=readLogs();
  a.push({time:new Date().toISOString(),level:String(level||'INFO'),event:String(event||''),detail:detail==null?'':String(detail)});
  writeLogs(a);
  updateLogMeta();
}
function setProcess(text,type='ok',detail=''){
  processStatus=text;
  const el=document.getElementById('processStatus');
  const txt=document.getElementById('processStatusText');
  if(el&&txt){el.className='processStatus '+type;txt.textContent=text;}
  if(detail)logEvent(type==='error'?'ERROR':'INFO','STATUS',text+' | '+detail);
}
function showConnectionError(message){
  const b=document.getElementById('errorBanner'),t=document.getElementById('errorBannerText');
  if(b&&t){t.textContent=message||'데이터 연결 오류';b.classList.add('show');}
  setProcess('연결 오류','error',message||'');
}
function clearConnectionError(){const b=document.getElementById('errorBanner');if(b)b.classList.remove('show')}
function updateLogMeta(){
  const el=document.getElementById('logMeta');if(!el)return;
  const a=readLogs();const lastErr=[...a].reverse().find(x=>x.level==='ERROR');
  el.textContent=`앱 ${APP_VERSION} · 로그 ${a.length}건 · 상태: ${processStatus}`+(lastErr?` · 마지막 오류: ${lastErr.event}`:'');
}
function buildLogText(){
  const a=readLogs();
  const head=[`WORSHIP APP LOG ${APP_VERSION}`,`copied_at=${new Date().toISOString()}`,`online=${navigator.onLine}`,`url=${location.href}`,`userAgent=${navigator.userAgent}`,`pending=${pending.length}`,`status=${processStatus}`,'---'];
  return head.concat(a.map(x=>`${x.time} [${x.level}] ${x.event}${x.detail?' | '+x.detail:''}`)).join('\n');
}
async function copyLogs(){
  const text=buildLogText();
  try{await navigator.clipboard.writeText(text)}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}
  showToast('로그를 복사했습니다');
  logEvent('INFO','LOG_COPIED',`count=${readLogs().length}`);
}
function clearLogs(){writeLogs([]);updateLogMeta();showToast('로그를 비웠습니다')}

function showApiError(message){showConnectionError(message||'Apps Script 응답을 확인할 수 없습니다.')}

function jsonp(action,params={},timeout=15000,options={}){
  const started=performance.now();
  logEvent('INFO','API_START',`action=${action}`);
  return new Promise((resolve,reject)=>{
    const cb='__wcb_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2);
    const script=document.createElement('script');
    const q=new URLSearchParams({app:'worship',action,callback:cb,_:String(Date.now()),...params});
    let done=false;

    const timer=setTimeout(()=>finish(new Error('서버 응답 시간이 초과되었습니다.')),timeout);

    function finish(err,data){
      if(done)return;done=true;clearTimeout(timer);
      try{delete window[cb]}catch(e){}
      script.remove();
      if(err){logEvent(options.background?'WARN':'ERROR',options.background?'API_FAIL_BG':'API_FAIL',`action=${action} ms=${Math.round(performance.now()-started)} msg=${err.message||err}`);reject(err)}else{logEvent('INFO','API_OK',`action=${action} ms=${Math.round(performance.now()-started)}`);resolve(data)}
    }

    window[cb]=data=>finish(null,data);
    script.onerror=()=>finish(new Error('Apps Script API에 연결하지 못했습니다.'));
    script.src=API_URL+'?'+q.toString();
    document.head.appendChild(script);
  });
}

function getClientId(){
  let id=safeGet('client_id');
  if(!id){
    id='c_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2);
    safeSet('client_id',id);
  }
  return id;
}
const CLIENT_ID=getClientId();

function loadQueue(){
  try{
    const a=JSON.parse(safeGet('queue')||'[]');
    return Array.isArray(a)?a:[];
  }catch(e){return[]}
}
function saveQueue(){safeSet('queue',JSON.stringify(pending))}
pending=loadQueue();

function loadCachedState(){
  try{
    const x=JSON.parse(safeGet('state')||'null');
    if(x&&x.roles&&x.members){STATE=x;return true}
  }catch(e){}
  return false;
}
function cacheState(){if(STATE)safeSet('state',JSON.stringify(STATE))}

function getRole(id){return STATE.roles.find(r=>String(r.role_id)===String(id))}
function getMember(id){return STATE.members.find(m=>String(m.member_id)===String(id))}
function eligibleMembers(roleId){
  const ids=new Set(STATE.memberRoles.filter(x=>String(x.role_id)===String(roleId)).map(x=>String(x.member_id)));
  return STATE.members.filter(m=>ids.has(String(m.member_id)));
}
function holidayMap(){
  const out={};
  STATE.holidays.forEach(h=>out[String(h.holiday_date)]={name:String(h.holiday_name||''),type:String(h.holiday_type||'')});
  return out;
}

async function bootstrap(showLoading=true,silentFailure=false){
  if(STATE&&(pending.length||flushing)){
    needsFullRefresh=true;
    logEvent('INFO','BOOTSTRAP_DEFER','save pending');
    return false;
  }
  if(readInFlight){
    logEvent('INFO','BOOTSTRAP_DEFER','read in flight');
    return false;
  }

  readInFlight=true;
  const started=performance.now();
  if(!silentFailure){
    setProcess(STATE?'동기화 중…':'연결 중…','working');
    clearConnectionError();
  }
  logEvent('INFO',silentFailure?'BOOTSTRAP_BG_START':'BOOTSTRAP_START',`cached=${!!STATE}`);

  try{
    const res=await jsonp('bootstrap',{},BOOTSTRAP_TIMEOUT_MS,{background:silentFailure});
    if(!res||!res.ok)throw new Error((res&&res.error)||'초기 데이터를 불러오지 못했습니다.');

    STATE=res.data;
    pending.forEach(applyOptimistic);
    cacheState();
    needsFullRefresh=false;

    const today=new Date((STATE.serverToday||keyOf(new Date()))+'T00:00:00');
    if(!viewMonth)viewMonth=new Date(today.getFullYear(),today.getMonth(),1);

    renderAll();
    clearConnectionError();
    if(!silentFailure||['동기화 중…','연결 중…','오프라인','동기화 실패 · 캐시 사용'].includes(processStatus)){
      setProcess('연결 완료','ok');
    }
    logEvent('INFO',silentFailure?'BOOTSTRAP_BG_OK':'BOOTSTRAP_OK',`ms=${Math.round(performance.now()-started)} revision=${STATE.revision}`);
    return true;
  }catch(e){
    if(silentFailure&&STATE){
      logEvent('WARN','BOOTSTRAP_BG_FAIL',e&&e.message?e.message:String(e));
      return false;
    }
    logEvent('ERROR','BOOTSTRAP_FAIL',e&&e.message?e.message:String(e));
    if(STATE){
      renderAll();
      setProcess(navigator.onLine?'동기화 실패 · 캐시 사용':'오프라인 · 캐시 사용',navigator.onLine?'error':'offline');
      showToast('기존 데이터로 표시 중');
    }else{
      showApiError(e&&e.message?e.message:String(e));
    }
    return false;
  }finally{
    readInFlight=false;
    if(pending.length&&!flushing){
      clearTimeout(retryTimer);
      retryTimer=setTimeout(flushQueue,50);
    }
  }
}

function queueMutation(type,payload){
  if(type==='rotationComplete'&&pending.some(x=>x.type==='rotationComplete'&&String((x.payload||{}).month)===String(payload.month))){
    showToast('이미 편성 저장 처리 중입니다');
    return;
  }
  const m={
    id:'mu_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2),
    clientId:CLIENT_ID,
    type,
    payload,
    createdAt:Date.now()
  };
  pending.push(m);
  saveQueue();
  logEvent('INFO','QUEUE_ADD',`type=${type} pending=${pending.length}`);
  setProcess('저장 대기…','working');
  applyOptimistic(m);
  renderAll();
  flushQueue();
}

function applyOptimistic(m){
  if(!STATE)return;
  const p=m.payload||{};

  if(m.type==='assignmentSet'){
    STATE.assignments=STATE.assignments.filter(a=>!(
      String(a.event_date)===String(p.date)&&
      String(a.role_id)===String(p.roleId)
    ));

    if((p.memberIds||[]).length){
      p.memberIds.forEach((id,i)=>STATE.assignments.push({
        assignment_id:'optimistic_'+m.id+'_'+i,
        event_date:p.date,
        role_id:p.roleId,
        member_id:id,
        sort_order:i+1,
        source:'manual',
        active:true
      }));
    }else{
      STATE.assignments.push({
        assignment_id:'optimistic_'+m.id,
        event_date:p.date,
        role_id:p.roleId,
        member_id:'',
        sort_order:0,
        source:'manual_clear',
        active:true
      });
    }
  }

  if(m.type==='eventSet'){
    STATE.events=STATE.events.filter(x=>String(x.event_date)!==String(p.date));
    STATE.events.push({
      event_date:p.date,
      event_type:'worship',
      title:p.title||'',
      active:!!p.active,
      source:'manual'
    });
  }

  if(m.type==='memberSave' && p.memberId){
    const member=STATE.members.find(x=>String(x.member_id)===String(p.memberId));
    if(member)member.member_name=p.name;
    STATE.memberRoles=STATE.memberRoles.filter(x=>String(x.member_id)!==String(p.memberId));
    (p.roleIds||[]).forEach(roleId=>{
      STATE.memberRoles.push({member_id:p.memberId,role_id:roleId,active:true});
    });
  }
}

async function flushQueue(){
  if(flushing||!pending.length)return;
  if(readInFlight){
    setProcess('저장 대기…','working');
    clearTimeout(retryTimer);
    retryTimer=setTimeout(flushQueue,250);
    return;
  }

  flushing=true;
  const m=pending[0];
  m.attempts=Number(m.attempts||0)+1;
  saveQueue();
  setProcess('저장 중…','working');
  logEvent('INFO','SAVE_START',`type=${m.type} attempt=${m.attempts} pending=${pending.length}`);

  try{
    const res=await jsonp('mutate',{payload:JSON.stringify(m)},MUTATE_TIMEOUT_MS);

    if(res&&res.busy){
      flushing=false;
      setProcess('저장 대기…','working');
      logEvent('INFO','SAVE_BUSY',`type=${m.type}`);
      clearTimeout(retryTimer);
      retryTimer=setTimeout(flushQueue,Math.max(500,Number(res.retryAfterMs||700)));
      return;
    }

    if(!res||!res.ok)throw new Error((res&&res.error)||'저장에 실패했습니다.');

    pending.shift();
    saveQueue();
    flushing=false;
    if(STATE&&res.revision!=null){STATE.revision=res.revision;cacheState();}
    logEvent('INFO','SAVE_OK',`type=${m.type} revision=${res.revision} remaining=${pending.length}`);

    if(m.type==='memberSave')showToast('멤버 저장 완료');
    if(m.type==='rotationComplete')showToast('이 달 편성 기준 저장 완료');

    if(pending.length){
      flushQueue();
      return;
    }

    setProcess('연결 완료','ok');

    // 서버 생성 ID/구조 변화 또는 로테이션 스냅샷은 백그라운드에서 재동기화합니다.
    // 실패해도 저장 성공 상태를 오류로 덮지 않고, pollRevision에서 성공할 때까지 다시 시도합니다.
    if((m.type==='memberSave'&&!m.payload.memberId)||['memberDelete','roleSave','roleDelete','prayerOrderSet','rotationComplete'].includes(m.type)){
      needsFullRefresh=true;
      logEvent('INFO','POST_SAVE_REFRESH',`type=${m.type}`);
      setTimeout(()=>bootstrap(false,true),250);
    }
  }catch(e){
    flushing=false;
    logEvent('ERROR','SAVE_FAIL',`type=${m.type} attempt=${m.attempts} msg=${e&&e.message?e.message:e}`);

    if(Number(m.attempts||0)<3){
      setProcess('저장 재시도…','working');
      clearTimeout(retryTimer);
      retryTimer=setTimeout(flushQueue,900*Number(m.attempts||1));
      return;
    }

    pending.shift();
    saveQueue();
    setProcess('저장 실패','error',e&&e.message?e.message:String(e));
    showToast('저장 실패 · 설정에서 로그를 복사해 주세요');

    // 실패한 낙관 변경을 서버/캐시 기준으로 되돌리되 저장 실패 상태는 유지합니다.
    bootstrap(false,true);
  }
}

function defaultSundays(mk){
  const [y,m]=mk.split('-').map(Number);
  const last=new Date(y,m,0).getDate();
  const out=[];
  for(let d=1;d<=last;d++){
    const x=new Date(y,m-1,d);
    if(x.getDay()===0)out.push(keyOf(x));
  }
  return out;
}

function selectedDates(mk){
  const map={};
  defaultSundays(mk).forEach(k=>map[k]=true);

  STATE.events.forEach(e=>{
    const date=String(e.event_date||'');
    if(date.slice(0,7)===mk)map[date]=isActive(e.active);
  });

  return Object.keys(map).filter(k=>map[k]).sort();
}

function monthNum(mk){
  const [y,m]=mk.split('-').map(Number);
  return y*12+(m-1);
}

function latestBase(mk){
  const target=monthNum(mk);
  const months=[...new Set(
    STATE.rotationBase
      .filter(r=>isActive(r.active))
      .map(r=>String(r.base_month||''))
      .filter(x=>/^\d{4}-\d{2}$/.test(x)&&monthNum(x)<=target)
  )].sort((a,b)=>monthNum(a)-monthNum(b));

  return months.length?months[months.length-1]:'';
}

function explicitAssignments(date,roleId){
  return STATE.assignments
    .filter(a=>isActive(a.active)&&String(a.event_date)===date&&String(a.role_id)===String(roleId))
    .sort((a,b)=>Number(a.sort_order||0)-Number(b.sort_order||0));
}

function effectiveMemberIds(date,roleId){
  const ex=explicitAssignments(date,roleId);
  if(ex.length){
    return ex.filter(a=>String(a.member_id||'')).map(a=>String(a.member_id));
  }

  const mk=date.slice(0,7);
  const base=latestBase(mk);
  if(!base)return[];

  const dates=selectedDates(mk);
  const targetIndex=dates.indexOf(date);
  if(targetIndex<0)return[];

  const indices=[...new Set(
    STATE.rotationBase
      .filter(r=>isActive(r.active)&&String(r.base_month)===base)
      .map(r=>Number(r.event_index||0))
  )].sort((a,b)=>a-b);

  if(!indices.length)return[];

  const patternIndex=indices[targetIndex%indices.length];

  return STATE.rotationBase
    .filter(r=>
      isActive(r.active)&&
      String(r.base_month)===base&&
      Number(r.event_index||0)===patternIndex&&
      String(r.role_id)===String(roleId)
    )
    .sort((a,b)=>Number(a.sort_order||0)-Number(b.sort_order||0))
    .filter(r=>String(r.member_id||''))
    .map(r=>String(r.member_id));
}

function isInherited(date,roleId){
  return explicitAssignments(date,roleId).length===0&&!!latestBase(date.slice(0,7));
}

function prayerNameForSunday(d){
  const arr=STATE.prayerOrder;
  if(!arr.length)return'미정';

  const anchor=STATE.config.PRAYER_ANCHOR_DATE||'2026-09-13';
  const anchorId=STATE.config.PRAYER_ANCHOR_MEMBER_ID||'m_parkseongin';
  const ad=new Date(anchor+'T00:00:00');
  const weeks=Math.round((d-ad)/86400000/7);

  let anchorIndex=arr.findIndex(x=>String(x.member_id)===String(anchorId));
  if(anchorIndex<0)anchorIndex=0;

  const row=arr[((anchorIndex+weeks)%arr.length+arr.length)%arr.length];
  return row.display_name||((getMember(row.member_id)||{}).member_name)||'미정';
}

  renderHeader();
  renderWeek();
  renderMonth();
  renderPrayer();
  renderPlaylist();
  renderSettings();
}

function renderHeader(){
  const d=new Date((STATE.serverToday||keyOf(new Date()))+'T00:00:00');
  document.getElementById('todayPill').textContent=`${d.getMonth()+1}.${d.getDate()} ${['일','월','화','수','목','금','토'][d.getDay()]}`;
}

function renderWeek(){
  const now=new Date((STATE.serverToday||keyOf(new Date()))+'T00:00:00');
  const sun=sundayOfWeek(now);
  const weeks=[
    {d:sun,title:'이번 주',badge:'THIS WEEK'},
    {d:addDays(sun,7),title:'다음 주',badge:'NEXT WEEK'}
  ];

  document.getElementById('weekCards').innerHTML=weeks.map(w=>{
    const date=keyOf(w.d);
    const prayer=prayerNameForSunday(w.d);

    return `<div class="card weekCard">
      <div class="weekHead">
        <div class="weekTitle">${w.title}<span class="weekBadge">${w.badge}</span></div>
        <div class="dateLine">${w.d.getMonth()+1}월 ${w.d.getDate()}일 (${['일','월','화','수','목','금','토'][w.d.getDay()]}) · 기도 <b>${escapeHtml(prayer)}</b></div>
      </div>
      <div class="weekRoles">
        ${STATE.roles.map(r=>{
          const cls=roleClass(r);
          const ids=effectiveMemberIds(date,r.role_id);
          return `<div class="weekRole">
            <div class="roleLabel"><span class="roleDot ${cls}"></span>${escapeHtml(r.role_name)}</div>
            <div class="people">${ids.length
              ?ids.map(id=>`<span class="person ${cls}">${escapeHtml((getMember(id)||{}).member_name||'알 수 없음')}</span>`).join('')
              :'<span class="empty">미정</span>'
            }</div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
}

function renderMonth(){
  const mk=monthKey(viewMonth);
  const [y,m]=mk.split('-').map(Number);
  const dates=selectedDates(mk);
  const hol=holidayMap();
  const base=latestBase(mk);

  document.getElementById('monthTitle').textContent=`${y}년 ${m}월`;
  const completeBtn=document.getElementById('completeMonth');
  const rotationSaving=pending.some(x=>x.type==='rotationComplete'&&String((x.payload||{}).month)===mk);
  completeBtn.disabled=rotationSaving;
  completeBtn.textContent=rotationSaving?'저장 중…':'이 달 편성 완료';
  document.getElementById('monthEdit').classList.toggle('on',monthEdit);
  document.getElementById('monthEdit').textContent=monthEdit?'편집중':'편집';
  document.getElementById('rotationTitle').textContent=base?`${base.replace('-','년 ')}월 로테이션 적용 중`:'로테이션 기준 없음';
  document.getElementById('rotationDesc').textContent='';
  document.getElementById('matrixInfo').textContent='';

  if(!dates.length){
    document.getElementById('matrixArea').innerHTML='<div class="info" style="margin:15px">선택된 찬양 일정이 없습니다.</div>';
    return;
  }

  let html='<div class="matrixScroll"><table class="matrix"><thead><tr><th class="roleCol">역할</th>';

  dates.forEach(date=>{
    const d=new Date(date+'T00:00:00');
    const h=hol[date];
    html+=`<th class="dateHead"><b>${d.getMonth()+1}/${d.getDate()}</b><span class="${h?'holiday':''}">${escapeHtml(h?h.name:['일','월','화','수','목','금','토'][d.getDay()])}</span></th>`;
  });

  html+='</tr></thead><tbody>';

  STATE.roles.forEach(r=>{
    const cls=roleClass(r);
    html+=`<tr><td class="roleCol"><div class="roleLabel"><span class="roleDot ${cls}"></span>${escapeHtml(r.role_name)}</div></td>`;

    dates.forEach(date=>{
      const ids=effectiveMemberIds(date,r.role_id);
      const inherited=isInherited(date,r.role_id);
      html+=`<td class="scheduleCell ${monthEdit?'editable':''}" ${monthEdit?`onclick="openPicker('${date}','${r.role_id}')"`:''}>${
        ids.length
        ?ids.map(id=>`<span class="cellPerson ${cls}">${escapeHtml((getMember(id)||{}).member_name||'알 수 없음')}${inherited?'<i class="autoMark"></i>':''}</span>`).join('')
        :'<span class="cellEmpty">미정</span>'
      }</td>`;
    });

    html+='</tr>';
  });

  html+='</tbody></table></div>';
  document.getElementById('matrixArea').innerHTML=html;
}

function renderPrayer(){
  const now=new Date((STATE.serverToday||keyOf(new Date()))+'T00:00:00');
  const sun=sundayOfWeek(now);
  const next=addDays(sun,7);
  const current=prayerNameForSunday(sun);
  const nextName=prayerNameForSunday(next);

  document.getElementById('prayerHero').innerHTML=`<div class="prayerHero">
    <div><div class="small">이번 주 기도</div><div class="big">${escapeHtml(current)} 집사님</div><div class="dateLine">${sun.getMonth()+1}월 ${sun.getDate()}일</div></div>
    <div class="nextPrayer"><small>다음 주</small><b>${escapeHtml(nextName)}</b></div>
  </div>`;

  const order=STATE.prayerOrder
    .map(x=>x.display_name||((getMember(x.member_id)||{}).member_name)||'')
    .filter(Boolean);

  document.getElementById('prayerCopyText').textContent=
`안녕하세요~
이번 주 기도는 ${current} 집사님 입니다.

기도 순서
${order.join(' - ')}`;

  let upcoming='';
  for(let i=0;i<9;i++){
    const d=addDays(sun,i*7);
    upcoming+=`<div class="prayerRow ${i===0?'current':''}">
      <div class="prayerNum">${i===0?'이번':i+1}</div>
      <div class="prayerName">${escapeHtml(prayerNameForSunday(d))} 집사님</div>
      <div class="prayerDate">${d.getMonth()+1}/${d.getDate()}</div>
    </div>`;
  }
  document.getElementById('prayerUpcoming').innerHTML=upcoming;
}

function renderPlaylist(){
  const playlistUrl=STATE&&STATE.config&&STATE.config.PLAYLIST_URL
    ?STATE.config.PLAYLIST_URL
    :`https://youtube.com/playlist?list=${PLAYLIST_ID}`;

  document.getElementById('youtubeFrame').src=`https://www.youtube.com/embed/videoseries?list=${PLAYLIST_ID}`;
  document.getElementById('youtubeLink').href=playlistUrl;
}

function renderSettings(){
  renderDateSettings();
  updateLogMeta();

  document.getElementById('memberList').innerHTML=STATE.members.map(m=>{
    const roles=STATE.memberRoles
      .filter(x=>String(x.member_id)===String(m.member_id))
      .map(x=>getRole(x.role_id))
      .filter(Boolean);

    return `<div class="memberRow">
      <div style="flex:1">
        <div class="memberName">${escapeHtml(m.member_name)}</div>
        <div class="tags">${roles.map(r=>`<span class="tag ${roleClass(r)}">${escapeHtml(r.role_name)}</span>`).join('')}</div>
      </div>
      <button class="iconBtn" onclick="openMemberForm('${m.member_id}')">수정</button>
    </div>`;
  }).join('');

  document.getElementById('roleList').innerHTML=STATE.roles
    .map(r=>`<button class="roleChip" onclick="openRoleForm('${r.role_id}')">${escapeHtml(r.role_name)}</button>`)
    .join('');

  document.getElementById('prayerOrderList').innerHTML=STATE.prayerOrder
    .map((x,i)=>`<span class="roleChip">${i+1}. ${escapeHtml(x.display_name||((getMember(x.member_id)||{}).member_name)||'')}</span>`)
    .join('');
}

function renderDateSettings(){
  const now=new Date((STATE.serverToday||keyOf(new Date()))+'T00:00:00');
  const month=new Date(now.getFullYear(),now.getMonth()+dateSettingOffset,1);
  const mk=monthKey(month);
  const selected=new Set(selectedDates(mk));
  const hol=holidayMap();

  const y=month.getFullYear();
  const m=month.getMonth();
  const first=new Date(y,m,1).getDay();
  const last=new Date(y,m+1,0).getDate();

  document.getElementById('dateSettingTitle').textContent=`${y}년 ${m+1}월 찬양 일정`;

  let html='';
  for(let i=0;i<first;i++)html+='<button class="dateCell blank"></button>';

  for(let day=1;day<=last;day++){
    const d=new Date(y,m,day);
    const date=keyOf(d);
    const h=hol[date];

    html+=`<button class="dateCell ${d.getDay()===0?'sun':''} ${selected.has(date)?'selected':''} ${h?'holiday':''}" onclick="toggleEventDate('${date}')">
      ${day}${h?`<small>${escapeHtml(h.name)}</small>`:''}
    </button>`;
  }

  document.getElementById('dateGrid').innerHTML=html;
}

function openModal(title,body){
  document.getElementById('modalTitle').textContent=title;
  document.getElementById('modalBody').innerHTML=body;
  document.getElementById('backdrop').classList.add('show');
  const modal=document.getElementById('modal');
  modal.classList.add('show');
  modal.scrollTop=0;
}
function closeModal(){
  document.getElementById('backdrop').classList.remove('show');
  document.getElementById('modal').classList.remove('show');
}
document.getElementById('closeModal').onclick=closeModal;
document.getElementById('backdrop').onclick=closeModal;

function openPicker(date,roleId){
  pickerDate=date;
  pickerRoleId=roleId;
  pickerSelected=effectiveMemberIds(date,roleId).slice();

  const role=getRole(roleId);
  const members=eligibleMembers(roleId);
  const multiple=isActive(role.allow_multiple);

  openModal(
    `${date} · ${role.role_name}`,
    `<div class="hint" style="margin-bottom:9px">${multiple?'이름을 누를 때마다 즉시 추가/해제됩니다.':'이름을 누르면 즉시 저장되고 닫힙니다.'}</div>
    <div class="pickGrid">
      <button class="pickBtn ${pickerSelected.length?'':'selected'}" onclick="pickNone()">미정</button>
      ${members.map(m=>`<button class="pickBtn ${pickerSelected.includes(String(m.member_id))?'selected':''}" onclick="pickMember('${m.member_id}')">${escapeHtml(m.member_name)}</button>`).join('')}
    </div>`
  );
}

function pickNone(){
  pickerSelected=[];
  queueMutation('assignmentSet',{date:pickerDate,roleId:pickerRoleId,memberIds:[]});
  closeModal();
}

function pickMember(id){
  const role=getRole(pickerRoleId);
  const multiple=isActive(role.allow_multiple);

  if(!multiple){
    pickerSelected=[id];
    queueMutation('assignmentSet',{date:pickerDate,roleId:pickerRoleId,memberIds:pickerSelected});
    closeModal();
    return;
  }

  pickerSelected=pickerSelected.includes(id)
    ?pickerSelected.filter(x=>x!==id)
    :[...pickerSelected,id];

  queueMutation('assignmentSet',{date:pickerDate,roleId:pickerRoleId,memberIds:pickerSelected});
  openPicker(pickerDate,pickerRoleId);
}

function toggleEventDate(date){
  const selected=selectedDates(date.slice(0,7)).includes(date);
  queueMutation('eventSet',{date,active:!selected,title:''});
}

function openMemberForm(id=''){
  const member=id?getMember(id):null;
  const selected=new Set(
    id
    ?STATE.memberRoles.filter(x=>String(x.member_id)===String(id)).map(x=>String(x.role_id))
    :[]
  );

  openModal(
    id?'멤버 수정':'멤버 추가',
    `<div class="formField"><label>이름</label><input id="memberNameInput" value="${escapeHtml(member?member.member_name:'')}" placeholder="이름"></div>
    <div class="formField"><label>가능 역할</label><div class="checkWrap">
      ${STATE.roles.map(r=>`<label class="checkPill"><input type="checkbox" value="${r.role_id}" ${selected.has(String(r.role_id))?'checked':''}><span>${escapeHtml(r.role_name)}</span></label>`).join('')}
    </div></div>
    <div class="modalActions">
      ${id?`<button class="dangerBtn" onclick="deleteMember('${id}')">삭제</button>`:''}
      <button class="primaryBtn" onclick="saveMemberForm('${id}')">저장</button>
    </div>`
  );
}

function saveMemberForm(id){
  const name=(document.getElementById('memberNameInput').value||'').trim();
  const roleIds=[...document.querySelectorAll('#modalBody .checkPill input:checked')].map(x=>x.value);

  if(!name){showToast('이름을 입력해주세요');return}
  queueMutation('memberSave',{memberId:id,name,roleIds});
  closeModal();
}

function deleteMember(id){
  if(!confirm('이 멤버를 목록에서 삭제할까요? 기존 과거 편성 기록은 유지됩니다.'))return;
  queueMutation('memberDelete',{memberId:id});
  closeModal();
}

function openRoleForm(id=''){
  const role=id?getRole(id):null;

  openModal(
    id?'역할 수정':'역할 추가',
    `<div class="formField"><label>역할명</label><input id="roleNameInput" value="${escapeHtml(role?role.role_name:'')}"></div>
    <div class="formField"><label>색상 분류</label><select id="roleColor">
      <option value="other">기본</option><option value="leader">인도자 보라</option><option value="piano">피아노 파랑</option><option value="bass">베이스 초록</option><option value="drum">드럼 주황</option><option value="singer">싱어 분홍</option>
    </select></div>
    <div class="formField"><label><input type="checkbox" id="roleMulti" ${role&&isActive(role.allow_multiple)?'checked':''}> 여러 명 동시 배정 허용</label></div>
    <div class="modalActions">
      ${id?`<button class="dangerBtn" onclick="deleteRole('${id}')">삭제</button>`:''}
      <button class="primaryBtn" onclick="saveRoleForm('${id}')">저장</button>
    </div>`
  );

  if(role)document.getElementById('roleColor').value=role.color_key||'other';
}

function saveRoleForm(id){
  const name=(document.getElementById('roleNameInput').value||'').trim();
  if(!name){showToast('역할명을 입력해주세요');return}

  queueMutation('roleSave',{
    roleId:id,
    name,
    colorKey:document.getElementById('roleColor').value,
    allowMultiple:document.getElementById('roleMulti').checked
  });
  closeModal();
}

function deleteRole(id){
  if(!confirm('이 역할을 삭제할까요? 기존 과거 편성 기록은 유지됩니다.'))return;
  queueMutation('roleDelete',{roleId:id});
  closeModal();
}

function openPrayerOrder(){
  window._prayerIds=STATE.prayerOrder.map(x=>String(x.member_id));

  openModal(
    '기도 순서 편집',
    `<div id="prayerEditRows"></div><div class="modalActions"><button class="primaryBtn" onclick="savePrayerOrder()">저장</button></div>`
  );

  renderPrayerEditor();
}

function renderPrayerEditor(){
  const ids=window._prayerIds||[];
  document.getElementById('prayerEditRows').innerHTML=ids.map((id,i)=>{
    const m=getMember(id);
    return `<div class="memberRow">
      <div style="flex:1"><div class="memberName">${i+1}. ${escapeHtml(m?m.member_name:'')}</div></div>
      <button class="iconBtn" onclick="movePrayer(${i},-1)">↑</button>
      <button class="iconBtn" onclick="movePrayer(${i},1)">↓</button>
    </div>`;
  }).join('');
}

function movePrayer(i,delta){
  const ids=window._prayerIds||[];
  const j=i+delta;
  if(j<0||j>=ids.length)return;
  [ids[i],ids[j]]=[ids[j],ids[i]];
  window._prayerIds=ids;
  renderPrayerEditor();
}

function savePrayerOrder(){
  queueMutation('prayerOrderSet',{memberIds:window._prayerIds||[]});
  closeModal();
}

document.getElementById('prevMonth').onclick=()=>{
  viewMonth=new Date(viewMonth.getFullYear(),viewMonth.getMonth()-1,1);
  renderMonth();
};
document.getElementById('nextMonth').onclick=()=>{
  viewMonth=new Date(viewMonth.getFullYear(),viewMonth.getMonth()+1,1);
  renderMonth();
};
document.getElementById('monthEdit').onclick=()=>{
  monthEdit=!monthEdit;
  renderMonth();
};
document.getElementById('completeMonth').onclick=()=>{
  if(confirm('현재 월 편성을 로테이션 기준으로 저장할까요? 이후 달은 이 패턴을 자동으로 이어받습니다.')){
    showToast('편성 기준 저장 중'); queueMutation('rotationComplete',{month:monthKey(viewMonth)});
  }
};
document.getElementById('copyPrayer').onclick=async()=>{
  const text=document.getElementById('prayerCopyText').textContent;
  try{
    await navigator.clipboard.writeText(text);
    showToast('기도 안내 문구를 복사했습니다');
  }catch(e){
    const ta=document.createElement('textarea');
    ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();

document.getElementById('addMember').onclick=()=>openMemberForm();
document.getElementById('addRole').onclick=()=>openRoleForm();
document.getElementById('editPrayerOrder').onclick=openPrayerOrder;
document.getElementById('copyLog').onclick=copyLogs;
document.getElementById('clearLog').onclick=clearLogs;
document.getElementById('retryConnection').onclick=()=>bootstrap(false);

document.querySelectorAll('.dateTab').forEach(b=>b.onclick=()=>{
  dateSettingOffset=Number(b.dataset.off);
  document.querySelectorAll('.dateTab').forEach(x=>x.classList.toggle('active',x===b));
  renderDateSettings();
});

document.querySelectorAll('.navBtn').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.navBtn').forEach(x=>x.classList.toggle('active',x===b));
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
  document.getElementById('tab-'+b.dataset.tab).classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
});

async function pollRevision(){
  if(!STATE||pending.length||flushing||readInFlight)return;
  if(needsFullRefresh){
    logEvent('INFO','POST_SAVE_REFRESH_RETRY','pending full refresh');
    await bootstrap(false,true);
    return;
  }

  readInFlight=true;
  let refreshNeeded=false;
  try{
    const r=await jsonp('revision',{},6000,{background:true});
    if(r&&r.ok&&Number(r.revision)!==Number(STATE.revision)){
      logEvent('INFO','REMOTE_CHANGE',`local=${STATE.revision} remote=${r.revision}`);
      needsFullRefresh=true;
      refreshNeeded=true;
    }
  }catch(e){
    logEvent('WARN','REVISION_FAIL',e&&e.message?e.message:String(e));
  }finally{
    readInFlight=false;
    if(pending.length&&!flushing){
      clearTimeout(retryTimer);
      retryTimer=setTimeout(flushQueue,50);
    }
  }

  if(refreshNeeded&&!pending.length&&!flushing)await bootstrap(false,true);
}

logEvent('INFO','APP_START',`version=${APP_VERSION}`);
const localNow=new Date();
document.getElementById('todayPill').textContent=`${localNow.getMonth()+1}.${localNow.getDate()} ${['일','월','화','수','목','금','토'][localNow.getDay()]}`;

const hadCachedState=loadCachedState();
if(hadCachedState){
  const today=new Date((STATE.serverToday||keyOf(new Date()))+'T00:00:00');
  viewMonth=new Date(today.getFullYear(),today.getMonth(),1);
  pending.forEach(applyOptimistic);
  renderAll();
  logEvent('INFO','CACHE_RENDERED',`revision=${STATE.revision}`);
  if(pending.length){
    setProcess('저장 대기…','working');
    setTimeout(flushQueue,80);
  }else{
    setProcess('연결 완료','ok');
    startupSyncTimer=setTimeout(pollRevision,1200);
  }
}else{
  viewMonth=new Date(localNow.getFullYear(),localNow.getMonth(),1);
  setProcess('연결 중…','working');
  bootstrap(false);
}

renderPlaylist();

pollTimer=setInterval(pollRevision,30000);
window.addEventListener('online',()=>{logEvent('INFO','NETWORK','online');if(pending.length)flushQueue();else if(STATE)pollRevision();else bootstrap(false)});
window.addEventListener('offline',()=>{logEvent('INFO','NETWORK','offline');setProcess('오프라인','offline')});
</script>
